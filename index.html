<title>IntegraFlux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Montserrat:wght@500;600;700&display=swap">
<style>
/* Concepto: sitio de varias páginas en una sola carga. Menú superior con desplegables,
   columna de lectura de 1160 px y el flujo OT/IT como pieza central del Inicio. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#E9EEF4;
  --ink:#1E2631; --ink-2:#3F4A59; --muted:#5C6877;
  --line:#DCE2EA; --line-strong:#B4BFCD;
  --accent:#2F9BF5; --accent-ink:#1769B5; --accent-soft:#E1F0FD; --on-accent:#0B1620;
  --btn-bg:#1769B5; --btn-fg:#FFFFFF;
  --warn-ink:#7A4E00; --warn-soft:#FFF2D2; --warn-line:#D9A53A;
  --ok:#1F8A5B;
  --calc-bg:#3F4A59; --calc-fg:#FFFFFF;
  --seg1:#2F9BF5; --seg2:#7DBDF8; --seg3:#B7DAFB;
  --shadow:0 14px 34px rgba(15,25,40,.14);
  --font-display:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --hh:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141B; --surface:#151D27; --surface-2:#1C2733;
    --ink:#E9EEF4; --ink-2:#C5CED9; --muted:#98A3B1;
    --line:#263140; --line-strong:#3A4859;
    --accent:#4DB0FF; --accent-ink:#7CC3FF; --accent-soft:#12283C; --on-accent:#0B1620;
    --btn-bg:#4DB0FF; --btn-fg:#0B1620;
    --warn-ink:#F0C36A; --warn-soft:#2B2310; --warn-line:#8A6A22;
    --ok:#46C28A;
    --calc-bg:#3A4656; --calc-fg:#FFFFFF;
    --seg1:#5BB7FF; --seg2:#3F9AE6; --seg3:#2F82CC;
    --shadow:0 14px 34px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#151D27; --surface-2:#1C2733;
  --ink:#E9EEF4; --ink-2:#C5CED9; --muted:#98A3B1;
  --line:#263140; --line-strong:#3A4859;
  --accent:#4DB0FF; --accent-ink:#7CC3FF; --accent-soft:#12283C; --on-accent:#0B1620;
  --btn-bg:#4DB0FF; --btn-fg:#0B1620;
  --warn-ink:#F0C36A; --warn-soft:#2B2310; --warn-line:#8A6A22;
  --ok:#46C28A;
  --calc-bg:#3A4656; --calc-fg:#FFFFFF;
  --seg1:#5BB7FF; --seg2:#3F9AE6; --seg3:#2F82CC;
  --shadow:0 14px 34px rgba(0,0,0,.5);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;color:var(--ink)}
h1{font-weight:600;font-size:clamp(2rem,4.6vw,3.35rem);line-height:1.08;letter-spacing:-.012em}
h2{font-weight:600;font-size:clamp(1.3rem,2.4vw,1.7rem);line-height:1.2}
h3{font-weight:600;font-size:1.02rem;line-height:1.3}
h4{font-weight:600;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent-ink);outline-offset:3px;border-radius:6px}

.wrap{max-width:1160px;margin-inline:auto;padding-inline:clamp(16px,4vw,32px)}
.skip{position:absolute;left:-9999px;top:8px;background:var(--btn-bg);color:var(--btn-fg);padding:8px 14px;border-radius:8px;z-index:100}
.skip:focus{left:16px}

/* Encabezado y menú */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:18px;height:var(--hh)}
.brand{display:flex;flex:none}
.plate{background:#fff;border-radius:8px;padding:3px 8px;display:flex;align-items:center;border:1px solid var(--line)}
.plate img{height:40px;width:auto;display:block}
.plate.big{padding:10px 18px;border-radius:12px;width:fit-content;max-width:100%}
.plate.big img{height:120px;max-width:100%;object-fit:contain}
.logo-hero{display:flex;justify-content:center;padding-top:40px}
.logo-hero .plate.big{padding:clamp(14px,3vw,30px) clamp(18px,4vw,48px);border-radius:16px}
.logo-hero .plate.big img{width:min(640px,100%);height:auto}
nav#nav{margin-left:auto}
.menu{display:flex;gap:2px;list-style:none;margin:0;padding:0}
.menu>li{position:relative}
.mi{display:inline-flex;align-items:center;gap:6px;font:600 13px var(--font-display);padding:10px 12px;border-radius:8px;color:var(--ink-2);background:none;border:0;cursor:pointer;white-space:nowrap}
.mi:hover{background:var(--surface-2)}
.mi[data-active="true"]{color:var(--accent-ink);box-shadow:inset 0 -2px 0 var(--accent)}
.car{transition:transform .15s}
.dd.open .car{transform:rotate(180deg)}
.panel{display:none;position:absolute;top:calc(100% + 10px);left:0;min-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:var(--shadow)}
.dd.open>.panel{display:block}
.pi{display:grid;grid-template-columns:1fr auto;gap:2px 14px;align-items:center;padding:10px 12px;border-radius:10px}
.pi:hover{background:var(--surface-2)}
.pi[aria-current="page"]{background:var(--accent-soft)}
.pt{font:600 14px var(--font-display);color:var(--ink)}
.pd{grid-column:1;font-size:12.5px;color:var(--muted);line-height:1.4}
.pi .st{grid-column:2;grid-row:1 / span 2}
.tbtn,.burger{flex:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.tbtn:hover,.burger:hover{background:var(--surface-2)}
.burger{display:none}

/* Chips de estado y etiquetas de origen */
.st{display:inline-flex;align-items:center;gap:7px;font:600 11.5px var(--font-body);padding:3px 10px 3px 8px;border-radius:999px;border:1px solid var(--line-strong);color:var(--ink-2);white-space:nowrap;background:var(--surface);line-height:1.5}
.st i{width:10px;height:10px;border-radius:50%;border:2px solid var(--muted);display:inline-block;flex:none}
.st-ok i{background:var(--ok);border-color:var(--ok)}
.st-part i{border-color:var(--accent);background:linear-gradient(90deg,var(--accent) 50%,transparent 50%)}
.st-dev i{background:transparent;border-color:var(--muted)}
.og{display:inline-block;font:600 11px var(--font-body);letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid;white-space:nowrap;line-height:1.5}
.og-P{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.og-R{background:transparent;color:var(--ink-2);border-color:var(--line-strong)}
.og-S{background:var(--warn-soft);color:var(--warn-ink);border-color:var(--warn-line);border-style:dashed}
.og-C{background:var(--calc-bg);color:var(--calc-fg);border-color:var(--calc-bg)}
.og-Y{background:var(--surface-2);color:var(--ink);border-color:var(--ink-2)}
.og-X{background:transparent;color:var(--muted);border-color:var(--line-strong);border-style:dotted}

/* Páginas */
.page{padding-block:36px 80px}
.eyebrow{font:600 11.5px var(--font-display);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.ph{display:grid;gap:14px;padding-bottom:8px}
.ph-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.lead{font-size:1.08rem;color:var(--ink-2);max-width:64ch}
.sec{padding-top:56px}
.sec.tight{padding-top:32px}
.sec-h{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:6px}
.sub{color:var(--muted);max-width:68ch;margin:6px 0 24px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
.grid>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}
.card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin-bottom:8px}
.card p{color:var(--ink-2);font-size:14px}
.empty{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border:1px dashed var(--line-strong);border-radius:12px;padding:18px 20px;color:var(--ink-2)}
.empty p{max-width:62ch}
.note{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;background:var(--surface-2);border-radius:12px;padding:14px 18px;font-size:13.5px;color:var(--ink-2)}
.note .chips{display:flex;flex-wrap:wrap;gap:8px}

/* Inicio */
.hero{position:relative;isolation:isolate;overflow:clip;padding-block:48px 36px}
.hero::before{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.6;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:36px 36px;-webkit-mask-image:linear-gradient(to bottom,#000 0,transparent 90%);mask-image:linear-gradient(to bottom,#000 0,transparent 90%)}
.hero h1{max-width:19ch;margin:0 0 18px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 14px var(--font-display);padding:12px 20px;border-radius:10px;background:var(--btn-bg);color:var(--btn-fg);border:1px solid var(--btn-bg);cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.facts{display:flex;flex-wrap:wrap;gap:8px 30px;list-style:none;padding:0;margin:34px 0 0;font:500 12.5px var(--font-mono);color:var(--ink-2)}
.facts li::before{content:'';display:inline-block;width:6px;height:6px;background:var(--accent);margin-right:9px;transform:translateY(-1px)}

/* Flujo OT / IT */
.arch{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px 24px}
.dir{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted)}
.dir b{font:500 12px var(--font-mono);color:var(--ink-2)}
.dir .ln{flex:1;height:1px;background:var(--line-strong);min-width:8px}
.dir span:not(.ln){text-align:center}
.track{position:relative;display:grid;grid-template-columns:repeat(6,1fr);margin:20px 0}
.nd{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:none;border:0;cursor:pointer;padding:0 6px;font:inherit}
.nd .dot{width:46px;height:46px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;font:500 12px var(--font-mono);color:var(--ink-2);position:relative;z-index:1;transition:background .15s,border-color .15s}
.nd .lb{font:600 13px var(--font-display);line-height:1.25;color:var(--ink)}
.nd:hover .dot{border-color:var(--accent)}
.nd[aria-pressed="true"] .dot{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.nd:not(:last-of-type)::after{content:'';position:absolute;top:22px;left:calc(50% + 23px);width:calc(100% - 46px);height:2px;background:var(--line-strong)}
.pulse{position:absolute;top:19px;left:8.33%;width:8px;height:8px;border-radius:50%;background:var(--accent);z-index:2;animation:fwd 6s linear infinite;pointer-events:none}
.pulse.r{background:var(--ink-2);animation:bck 6s linear infinite 3s}
@keyframes fwd{0%{left:8.33%;opacity:0}8%{opacity:1}92%{opacity:1}100%{left:91.67%;opacity:0}}
@keyframes bck{0%{left:91.67%;opacity:0}8%{opacity:1}92%{opacity:1}100%{left:8.33%;opacity:0}}
.dp{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:22px 28px;margin-top:22px;padding-top:22px;border-top:1px solid var(--line)}
.dp>*{min-width:0}
.dp h3{margin:6px 0 8px;font-size:1.15rem}
.dp p{color:var(--ink-2);font-size:14px;margin-bottom:12px}
.dp ul{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px;color:var(--ink-2)}
.dp li{padding-left:14px;position:relative}
.dp li::before{content:'';position:absolute;left:0;top:.7em;width:6px;height:2px;background:var(--accent)}

#arq-flujo{scroll-margin-top:calc(var(--hh) + 16px)}
.strip{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,1fr)}
.strip li{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:0 6px}
.strip .dot{width:46px;height:46px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;font:500 12px var(--font-mono);color:var(--ink-2);position:relative;z-index:1}
.strip .lb{font:600 13px var(--font-display);line-height:1.25;color:var(--ink)}
.strip li:not(:last-child)::after{content:'';position:absolute;top:22px;left:calc(50% + 23px);width:calc(100% - 46px);height:2px;background:var(--line-strong)}
.strip-foot{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-top:22px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px}

/* Tarjetas de página y de línea */
.pcard{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0;transition:border-color .15s,transform .15s}
.pcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.pcard .eyebrow{font-size:10.5px}
.pcard p{color:var(--ink-2);font-size:14px}
.pcard .go{margin-top:auto;padding-top:6px;font:600 13px var(--font-display);color:var(--accent-ink)}
.pcard .top-r{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.lcard{position:relative;display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;min-width:0;transition:border-color .15s,transform .15s}
.lcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.lcard .n{font:600 4.2rem/1 var(--font-display);color:var(--line-strong);letter-spacing:-.04em}
.lcard .ops{font-size:13.5px;color:var(--ink-2)}
.lcard .go{margin-top:auto;padding-top:8px;font:600 13px var(--font-display);color:var(--accent-ink)}
.ops3{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.pills{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.pills li{border:1px solid var(--line-strong);border-radius:8px;padding:5px 11px;font-size:13px;color:var(--ink-2);background:var(--surface)}
.steps3{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;font:600 14px var(--font-display)}
.steps3 span.ar{color:var(--muted)}
.steps3 .sp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 16px}

/* Selector situación inicial / propuesta */
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{font:600 13px var(--font-display);padding:8px 14px;border-radius:8px;border:0;background:transparent;color:var(--ink-2);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--accent-ink);box-shadow:0 1px 3px rgba(15,25,40,.18)}
.swbar{position:sticky;top:calc(var(--hh) + env(safe-area-inset-top,0px));z-index:40;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--line);margin-top:24px}
.subnav{display:flex;flex-wrap:wrap;gap:2px}
.subnav button{font:500 13px var(--font-body);border:0;background:none;color:var(--ink-2);padding:6px 10px;border-radius:8px;cursor:pointer}
.subnav button:hover{background:var(--surface-2)}
.vtag{font:600 11px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
[id^="g-"]{scroll-margin-top:calc(var(--hh) + 84px)}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.kpi .kd{font-size:13px;color:var(--muted);margin-top:2px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.kv span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.kv b{font:600 1.55rem var(--font-display);color:var(--line-strong)}
.kv .kg{grid-column:1 / -1;border-top:1px solid var(--line);padding-top:10px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
th,td{padding:11px 14px;text-align:left;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:0;background:var(--surface-2);font:600 12px var(--font-display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
tbody th{font-weight:600;color:var(--ink);white-space:nowrap}
td{color:var(--ink-2)}
td.mut{color:var(--muted)}

/* Ficha de 12 capas */
.legend{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.legend div{display:flex;flex-direction:column;gap:6px;align-items:flex-start;font-size:13px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.idx{position:sticky;top:calc(var(--hh) + env(safe-area-inset-top,0px));z-index:40;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--bg);padding-block:10px;margin-top:40px;border-bottom:1px solid var(--line)}
.idx button{font:500 12px var(--font-mono);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);border-radius:6px;padding:4px 9px;cursor:pointer}
.idx button:hover{border-color:var(--accent);color:var(--accent-ink)}
.idx .all{margin-left:auto;font:600 12.5px var(--font-body);border-style:dashed}
#capas{padding-top:16px}
.capa{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;scroll-margin-top:calc(var(--hh) + 72px)}
.capa summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:16px;padding:16px 20px}
.capa summary::-webkit-details-marker{display:none}
.num{font:500 13px var(--font-mono);color:var(--accent-ink);border:1px solid var(--line-strong);border-radius:6px;padding:3px 8px;min-width:2.8em;text-align:center;flex:none}
.sm{display:flex;flex-direction:column;min-width:0;flex:1}
.ct{font:600 1.02rem var(--font-display)}
.gist{font-size:13px;color:var(--muted)}
.chev{flex:none;color:var(--muted);transition:transform .2s}
details[open]>summary .chev{transform:rotate(180deg)}
.capa-body{padding:6px 20px 20px;border-top:1px solid var(--line)}
.capa-body>*+*{margin-top:18px}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:11px 0;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.rows .t{min-width:0;color:var(--ink-2)}
.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:none}
.lvl{display:inline-block;font:600 10.5px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--surface-2);border-radius:4px;padding:1px 6px;margin-right:6px}
.foot-note{font-size:13px;color:var(--muted)}
.gh{display:inline-flex;font-size:12.5px;color:var(--muted);border:1px dashed var(--line-strong);border-radius:8px;padding:5px 10px}
.h5{font:600 12px var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.flow{list-style:none;margin:0;padding:0;columns:2 340px;column-gap:44px}
.flow li{position:relative;break-inside:avoid;padding:0 0 18px 30px}
.flow li::before{content:'';position:absolute;left:5px;top:18px;bottom:-4px;width:2px;background:var(--line-strong)}
.flow li:last-child::before{display:none}
.flow li::after{content:'';position:absolute;left:0;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.flow li.br::after{border-style:dashed}
.flow .id{display:block;font:500 11.5px var(--font-mono);color:var(--muted)}

function setView(sc,v){
  sc.dataset.view=v;
  $$('.seg button',sc).forEach(function(x){x.setAttribute('aria-selected',x.dataset.view===v)});
  $$('[data-v]',sc).forEach(function(el){el.hidden=el.dataset.v!==v});
}
$$('[data-scope]').forEach(function(sc){setView(sc,'inicial')});

var cur='';
function closeDD(){$$('.dd.open').forEach(function(d){d.classList.remove('open');$('[data-dd]',d).setAttribute('aria-expanded','false')})}
function closeNav(){$('#nav').classList.remove('open');$('#burger').setAttribute('aria-expanded','false')}
function show(id,push){
  if(!PAGES[id]) id='inicio';
  cur=id;
  $$('.page').forEach(function(p){p.hidden=p.id!=='p-'+id});
  $$('.pi').forEach(function(a){a.setAttribute('aria-current',a.dataset.go===id?'page':'false')});
  $$('.mi[data-grp]').forEach(function(b){b.dataset.active=(' '+b.dataset.grp+' ').indexOf(' '+id+' ')>-1});
  closeDD();closeNav();
  window.scrollTo(0,0);
  $$('[data-gantt]').forEach(function(g){if(g._fit)g._fit()});
  if(push!==false){try{history.replaceState(null,'','#'+id)}catch(e){}}
}

  var t=e.target;

  var dd=t.closest('[data-dd]');
  if(dd){var li=dd.closest('.dd');var was=li.classList.contains('open');closeDD();if(!was){li.classList.add('open');dd.setAttribute('aria-expanded','true')}return}
  if(!t.closest('.dd')) closeDD();
  var sc=t.closest('[data-scroll]'); if(sc){var el=document.getElementById(sc.dataset.scroll);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  var sg=t.closest('.seg button'); if(sg){setView(sg.closest('[data-scope]'),sg.dataset.view);return}
  var cp=t.closest('[data-capa]'); if(cp){var d=document.getElementById('capa-'+cp.dataset.capa);d.open=true;d.scrollIntoView({behavior:'smooth',block:'start'});return}
  var all=t.closest('[data-allcapas]');
  if(all){var open=all.dataset.allcapas!=='close';all.closest('.page').querySelectorAll('.capa').forEach(function(d){d.open=open});all.dataset.allcapas=open?'close':'open';all.textContent=open?'Contraer todo':'Expandir todo';return}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeDD();closeNav()}});
$('#burger').addEventListener('click',function(){var o=$('#nav').classList.toggle('open');this.setAttribute('aria-expanded',o)});
var dark=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;
$('#theme').addEventListener('click',function(){dark=!dark;document.documentElement.dataset.theme=dark?'dark':'light'});
window.addEventListener('hashchange',function(){var id=location.hash.slice(1);if(id&&id!==cur&&PAGES[id])show(id,false)});
document.addEventListener('click',function(e){var b=e.target.closest('[data-vsm-tab]');if(b){var s=b.closest('.dg-sub,.sec,div');var root=b.parentNode.parentNode;root.querySelectorAll('[data-vsm-tab]').forEach(function(x){x.setAttribute('aria-selected',x===b)});root.querySelectorAll('[data-vsm-fig]').forEach(function(f){f.hidden=f.dataset.vsmFig!==b.dataset.vsmTab});return}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){var o=document.querySelector('.vsm-ov');if(o)o.remove()}});
show((location.hash||'').slice(1)||'inicio',false);
})();
